name: CI

on:
  push:
    branches: [ main, Diagnostic_Levels ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Aegis.Diagnostics
        uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: main
          path: Common/Common.Diagnostics

      - name: Checkout Common.Messaging
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          path: Common/Common.Messaging

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Checkout Common.Storage
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          path: Common/Common.Storage

      - name: Move Common to sibling layout
        shell: pwsh
        run: |
          $sibling = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $sibling) { Remove-Item $sibling -Recurse -Force }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $sibling

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Aegis.Diagnostics.UnitTests/Aegis.Diagnostics.UnitTests.csproj

      - name: Build Debug
        run: dotnet build Aegis.Diagnostics.UnitTests/Aegis.Diagnostics.UnitTests.csproj --no-restore --configuration Debug

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build Aegis.Diagnostics.UnitTests/Aegis.Diagnostics.UnitTests.csproj --no-restore --configuration Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-build-log
          path: build.log

      - name: Test
        run: dotnet test Aegis.Diagnostics.UnitTests/Aegis.Diagnostics.UnitTests.csproj --no-build --configuration Release
