name: DiagnosticLevel App Validation

on:
  push:
    branches: [ DiagnosticLevel-AppValidation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation repo
        uses: actions/checkout@v4
        with:
          path: Validation

      - name: Checkout Aegis.Hello DiagnosticLevel
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Aegis.Hello
          ref: DiagnosticLevel
          path: Aegis.Hello

      - name: Checkout Aegis.Configuration DiagnosticLevel
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Aegis.Configuration
          ref: DiagnosticLevel
          path: Aegis.Configuration

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Hello
        run: dotnet restore Aegis.Hello/Aegis.Hello.csproj -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Hello Debug
        run: dotnet build Aegis.Hello/Aegis.Hello.csproj --no-restore --configuration Debug -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Hello Release
        run: dotnet build Aegis.Hello/Aegis.Hello.csproj --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Test Configuration Debug
        working-directory: Aegis.Configuration
        run: dotnet test Aegis.Configuration.Tests/Aegis.Configuration.Tests.csproj --configuration Debug -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Configuration Web Debug
        working-directory: Aegis.Configuration
        run: dotnet build Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Debug -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Test Configuration Release
        working-directory: Aegis.Configuration
        run: dotnet test Aegis.Configuration.Tests/Aegis.Configuration.Tests.csproj --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Configuration Web Release
        working-directory: Aegis.Configuration
        run: dotnet build Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"