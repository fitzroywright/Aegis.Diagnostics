name: Temporary Control Plane DiagnosticLevel Validation

on:
  push:
    branches: [ DiagnosticLevel-Hardening ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation host
        uses: actions/checkout@v4
        with:
          path: Aegis.Diagnostics

      - name: Checkout Aegis.Hello DiagnosticLevel
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Aegis.Hello
          ref: DiagnosticLevel
          path: Aegis.Hello

      - name: Checkout Aegis.Configuration DiagnosticLevel
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Aegis.Configuration
          ref: DiagnosticLevel
          path: Aegis.Configuration

      - name: Checkout Aegis.Operations DiagnosticLevel
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Aegis.Operations
          ref: DiagnosticLevel
          path: Aegis.Operations

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Aegis.Hello
        run: dotnet build Aegis.Hello/Aegis.Hello.csproj --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Aegis.Configuration Web
        run: dotnet build Aegis.Configuration/Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Build Aegis.Operations
        run: dotnet build Aegis.Operations/Aegis.Operations.csproj --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"
