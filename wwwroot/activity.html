<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logs · Diagnostics</title>
<link rel="stylesheet" href="/lcars.css">
<style>
.detail-scroll{overflow:hidden!important;display:flex!important;flex-direction:column;gap:6px;padding:8px 10px 6px 10px!important}
.activity-tabs{display:flex;gap:8px;margin:0 0 2px}.activity-tabs button{border:0;border-radius:16px;padding:8px 14px;font-weight:800;cursor:pointer;background:#314654;color:#fff}.activity-tabs button.active{background:#e7b94f;color:#050505}
.filter-toggle-row{display:flex;justify-content:flex-end;align-items:center;min-height:26px}
.activity-toolbar{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:7px;margin:0;padding:8px 10px;background:#02090e;max-height:220px;opacity:1;overflow:hidden;transition:max-height .18s ease,opacity .14s ease,padding .18s ease}
.activity-toolbar.collapsed{max-height:0;opacity:0;padding-top:0;padding-bottom:0;pointer-events:none}
.activity-toolbar input,.activity-toolbar select{background:#03131d;color:#eaf6ff;border:1px solid #2a668d;border-radius:4px;padding:7px 8px;font-size:12px}.activity-toolbar .wide{grid-column:span 2}
.activity-actions{display:flex;gap:6px;align-items:center;margin:0;min-height:28px}.activity-actions button,.filter-toggle-row button,.activity-toolbar button,.empty button{border:0;border-radius:5px;padding:6px 9px;font-weight:800;cursor:pointer;background:#5588ee;color:#071018;text-transform:uppercase;font-size:10px}.activity-toolbar button.secondary,.empty button{background:#7799dd}.activity-actions span{margin-left:auto}
.activity-panel{border:0;border-radius:0;background:#000;overflow:hidden;flex:1;min-height:0;margin:0 2px;position:relative}
.activity-log{height:100%;min-height:0;overflow:auto;padding:2px 0}
.activity-row{display:grid;grid-template-columns:168px 190px 150px 104px minmax(260px,1fr) 88px;gap:0 12px;padding:6px 10px;min-height:34px;border-bottom:1px solid rgba(35,90,124,.28);align-items:center;background:#03080d;outline:none;font:12px/1.25 ui-monospace,SFMono-Regular,Consolas,monospace}
.activity-row:hover{background:#061019}.activity-row.active,.activity-row[aria-selected="true"],.activity-row:focus{background:#061019;color:inherit;box-shadow:none}
.activity-row .time{color:#8ca2b1}.activity-row .app{color:#8fd0fb}.activity-row .flow{color:#d8aff7}.activity-row .detail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-row .analyze{border:0;background:transparent;color:#e7b94f;font:inherit;font-weight:900;cursor:pointer}
.Information,.Started{color:#8fd0fb}.Debug,.Trace{color:#8ca2b1}.Warning{color:#e7b94f}.Error,.Critical,.Failed{color:#f16f69}.Succeeded{color:#78d99b}
.empty{padding:36px;text-align:center;color:#8ca2b1}.filter-summary{flex:0 0 auto;min-height:28px;display:flex;align-items:center;gap:8px;padding:4px 8px;margin:0 2px;background:#071018;border-top:2px solid #e7b94f;color:#99ccff;font:800 10px/1.2 Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden}.filter-summary b{color:#e7b94f}.filter-summary span{overflow:hidden;text-overflow:ellipsis}
.flow-overlay{position:absolute;z-index:40;right:26px;top:72px;width:min(780px,calc(100% - 150px));max-height:calc(100% - 92px);display:flex;flex-direction:column;background:#02080d;border:2px solid #e7b94f;box-shadow:0 12px 34px rgba(0,0,0,.78);overflow:hidden}.flow-overlay[hidden]{display:none}.flow-overlay-head{display:flex;align-items:center;gap:12px;background:#e7b94f;color:#071018;padding:8px 10px;font-weight:900;text-transform:uppercase}.flow-overlay-head .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flow-overlay-head button{border:0;background:#071018;color:#e7b94f;font-weight:900;padding:5px 9px;cursor:pointer}.flow-overlay-body{overflow:auto;min-height:140px;padding:10px}.trace{background:#040b11;margin-bottom:10px}.trace-head{display:flex;gap:14px;align-items:center;padding:12px 14px;background:#091522}.trace-head .grow{flex:1}.trace-meta{color:#8ca2b1;font-size:12px}.stages{display:flex;align-items:flex-start;padding:20px 14px;overflow-x:auto}.stage{min-width:150px;text-align:center;position:relative}.stage:not(:last-child):after{content:"";position:absolute;top:12px;left:59%;width:82%;height:3px;background:#314654}.lamp{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;margin:0 auto 8px;background:#53646f}.lamp.Succeeded{background:#78d99b}.lamp.Warning{background:#e7b94f}.lamp.Failed{background:#f16f69}.lamp.Started{background:#5588ee}.stage b{display:block;font-size:12px}.stage small{display:block;color:#8ca2b1;margin-top:4px}.overlay-empty{padding:22px;color:#8ca2b1;text-align:center}
@media(max-width:950px){.activity-toolbar{grid-template-columns:repeat(2,1fr)}.activity-row{grid-template-columns:132px 1fr 92px 74px}.activity-row .flow,.activity-row .detail{display:none}.flow-overlay{right:12px;width:calc(100% - 130px)}}
</style>
</head>
<body>
<header class="lcars-top">
  <div class="left-vertical"></div><div class="left-gold"></div><div class="bottom-arm"></div><div class="join-dot"></div>
  <div class="brand"><div class="section">Diagnostics</div><div class="org">Food For The Poor Jamaica</div><div class="datetime" id="brandDateTime"></div><div class="brand-user" id="brandUser">SIGNED IN</div></div>
  <div class="live-log"><div class="recent-title">Recent Logs</div><div class="recent-rows" id="liveLog"><div class="row"><span class="t">--:--:--</span> <span class="inf">INF</span> <span class="src">[Logs]</span> Connecting to centralized suite telemetry</div></div></div>
  <div class="top-buttons"><a class="blue" href="/handoff/operations">Operations</a><a class="salmon" href="/">Diagnostics</a><a class="gold" href="/handoff/configuration">Configuration</a><a class="logout" href="/auth/logout">Logout</a></div>
</header>

<section class="workspace-shell">
  <div class="workspace-arm"><div class="workspace-title">Logs</div><div class="last-scan" id="lastScan">Last Scan: SCANNING</div></div><div class="workspace-leg"></div>
  <nav class="workspace-nav"><a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Overview</span></a><a href="/#systemHealth"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-5 3.2 10 2.3-5H21"/></svg><span>Health</span></a><a href="/console.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6.5 3-3 3 3-3 3M16 8 8 16"/><path d="m9 15-4.5 4.5a2.1 2.1 0 0 1-3-3L6 12"/></svg><span>Engineering</span></a><a href="/incidents.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg><span>Incidents</span></a><a class="active" href="/activity.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h10"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Logs</span></a></nav>
  <button class="lcars-back" type="button" onclick="if(history.length>1){history.back()}else{location.href='/'}">Back</button>
  <main class="detail-scroll">
    <div class="activity-tabs"><button id="activityTab" class="active">Lifecycle Logs</button><button id="logsTab">Application Logs</button></div>
    <div class="filter-toggle-row"><button id="filterToggle" type="button" aria-expanded="false" aria-controls="filtersPanel">Show Filters</button></div>
    <section class="activity-toolbar collapsed" id="filtersPanel" aria-hidden="true">
      <input id="application" placeholder="Application">
      <input id="instance" placeholder="Instance">
      <input id="flow" placeholder="Flow">
      <select id="level"><option value="">All Levels</option><option>Trace</option><option>Debug</option><option>Information</option><option>Warning</option><option>Error</option><option>Critical</option></select>
      <input id="correlation" placeholder="Correlation ID">
      <input id="minutes" type="number" min="1" max="10080" value="60" placeholder="Minutes">
      <input id="text" class="wide" placeholder="Search message, stage, code, detail…">
      <button id="apply">Apply Filter</button>
      <button id="reset" class="secondary">Reset Filters</button>
    </section>
    <div class="activity-actions">
      <button id="pause">Pause</button>
      <button id="follow">Tail: On</button>
      <button id="clear">Clear</button>
      <span id="state" class="muted">CONNECTING…</span>
    </div>
    <section class="activity-panel"><div id="view" class="activity-log" tabindex="0" aria-label="Diagnostics log results"></div></section>
    <div id="filterSummary" class="filter-summary"><b>FILTER</b><span>None · 0 events</span></div>
  </main>
  <aside class="flow-overlay" id="flowOverlay" hidden role="dialog" aria-modal="false" aria-labelledby="flowOverlayTitle">
    <div class="flow-overlay-head"><span id="flowOverlayTitle">Flow Analyzer</span><span class="grow" id="flowOverlayContext"></span><button id="flowOverlayClose" type="button">Close</button></div>
    <div class="flow-overlay-body" id="flowOverlayBody"></div>
  </aside>
</section>

<script src="/session.js">

</script>
<script>
const api='/api/engineering/diagnostics', $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let mode='activity',paused=false,followTail=true,hiddenBefore=null,eventsNow=[],selectedKey=null,selectedEvent=null,overlayOpen=false,lastFocused=null,analyzerEvent=null;
function recentStamp(v){const d=v?new Date(v):new Date();if(Number.isNaN(d.getTime()))return '--- -- ---- --:-- --';const mon=d.toLocaleString('en-US',{month:'short'});let h=d.getHours(),tt=h>=12?'PM':'AM';h=h%12||12;return mon+' '+String(d.getDate()).padStart(2,'0')+' '+d.getFullYear()+' '+String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' '+tt}
document.querySelectorAll('#liveLog .t').forEach(x=>{if(!x.textContent||x.textContent.includes('--:--:--'))x.textContent=recentStamp();});
function updateBrandClock(){const d=new Date(),target=document.getElementById('brandDateTime')||document.getElementById('brandDateTime');if(!target)return;const month=d.toLocaleString('en-US',{month:'short'}).toUpperCase(),day=String(d.getDate()).padStart(2,'0'),year=d.getFullYear();let h=d.getHours(),tt=h>=12?'PM':'AM';h=h%12||12;target.textContent=month+' '+day+' '+year+' '+String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' '+tt;}updateBrandClock();setInterval(updateBrandClock,1000);
function fmt(v){const d=new Date(v);return Number.isNaN(d.valueOf())?'—':recentStamp(d)+'.'+String(d.getMilliseconds()).padStart(3,'0')}
function params(){const p=new URLSearchParams(),app=$('application').value.trim(),inst=$('instance').value.trim(),corr=$('correlation').value.trim(),text=$('text').value.trim(),m=parseInt($('minutes').value||'0',10);if(app)p.set('applicationId',app);if(inst)p.set('instanceId',inst);if(corr)p.set('correlationId',corr);if(text)p.set('text',text);if(m>0)p.set('since',new Date(Date.now()-m*60000).toISOString());p.set('take','1500');if(mode==='activity'){const flow=$('flow').value.trim();if(flow)p.set('flow',flow)}else{const cat=$('flow').value.trim(),lvl=$('level').value.trim();if(cat)p.set('category',cat);if(lvl)p.set('level',lvl)}return p}
function filterLabel(){const parts=[],add=(id,label)=>{const v=$(id).value.trim();if(v)parts.push(label+'='+v)};add('application','App');add('instance','Instance');add('flow',mode==='activity'?'Flow':'Category');if(mode==='logs')add('level','Level');add('correlation','Correlation');add('text','Text');const m=parseInt($('minutes').value||'0',10);if(m>0)parts.push('Last '+m+'m');return parts.length?parts.join(' · '):'None'}
function updateSummary(count){$('filterSummary').innerHTML='<b>FILTER</b><span>'+esc(filterLabel())+' · '+count+' '+(mode==='logs'?'logs':'events')+'</span>'}
function setFiltersOpen(open){$('filtersPanel').classList.toggle('collapsed',!open);$('filtersPanel').setAttribute('aria-hidden',String(!open));$('filterToggle').setAttribute('aria-expanded',String(open));$('filterToggle').textContent=open?'Hide Filters':'Show Filters'}
$('filterToggle').onclick=()=>setFiltersOpen($('filtersPanel').classList.contains('collapsed'));
function eventKey(e){return String(e.eventId||[e.occurredAtUtc||e.timestampUtc,e.applicationId,e.instanceId,e.correlationId,e.stage||e.category,e.code||e.message].join('|'))}
function detailText(e){return mode==='activity'?[e.stage,e.code,e.detail].filter(Boolean).join(' · '):String(e.message||'')}
function rowMarkup(e){const key=esc(eventKey(e)),when=e.occurredAtUtc||e.timestampUtc,flow=mode==='activity'?e.flow:e.category,status=mode==='activity'?e.outcome:e.level,corr=e.correlationId||'';return '<div class="activity-row" role="row" aria-selected="false" tabindex="-1" data-key="'+key+'"><span class="time">'+fmt(when)+'</span><span class="app">'+esc(e.applicationId)+'</span><span class="flow">'+esc(flow)+'</span><span class="status '+esc(status)+'">'+esc(status)+'</span><span class="detail" title="'+esc(detailText(e))+'">'+esc(detailText(e))+'</span><button class="analyze" type="button" data-correlation="'+esc(corr)+'">'+(corr?'Analyze →':'—')+'</button></div>'}
function selectEvent(e,focus=false){if(!e)return;selectedKey=eventKey(e);selectedEvent=e;document.querySelectorAll('#view .activity-row').forEach(r=>{const selected=r.dataset.key===selectedKey;r.classList.toggle('active',selected);r.setAttribute('aria-selected',String(selected));r.tabIndex=selected?0:-1});const active=document.querySelector('#view .activity-row[aria-selected="true"]');if(active){active.scrollIntoView({block:'nearest'});if(focus)active.focus({preventScroll:true})}}
function restoreSelection(){if(!eventsNow.length){selectedKey=null;selectedEvent=null;return}selectEvent(eventsNow.find(e=>eventKey(e)===selectedKey)||eventsNow[0])}
function bindRows(){document.querySelectorAll('#view .activity-row').forEach(row=>{row.onclick=e=>{if(e.target.closest('.analyze'))return;selectEvent(eventsNow.find(x=>eventKey(x)===row.dataset.key),true)};row.onfocus=()=>selectEvent(eventsNow.find(x=>eventKey(x)===row.dataset.key))});$('view').onkeydown=e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;e.preventDefault();if(!eventsNow.length)return;let i=eventsNow.findIndex(x=>eventKey(x)===selectedKey);if(i<0)i=0;else i=Math.max(0,Math.min(eventsNow.length-1,i+(e.key==='ArrowDown'?1:-1)));selectEvent(eventsNow[i],true)};document.querySelectorAll('#view .analyze').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.correlation)openAnalyzer(b.dataset.correlation,b.closest('.activity-row')?.dataset.key)})}
function emptyMarkup(){return '<div class="empty">No '+(mode==='logs'?'application logs':'log events')+' match the active filters.<br><button type="button" onclick="resetFilters()">Reset Filters</button></div>'}
async function refreshOverlay(){if(!overlayOpen)return;const e=analyzerEvent,c=e?.correlationId;$('flowOverlayContext').textContent=e?[(e.applicationId||''),(mode==='activity'?e.flow:e.category)||'',c||'No correlation ID'].filter(Boolean).join(' · '):'No event selected';if(!c){$('flowOverlayBody').innerHTML='<div class="overlay-empty">The selected event has no correlation ID, so no system flow can be resolved.</div>';return}$('flowOverlayBody').innerHTML='<div class="overlay-empty">Loading observed flow…</div>';try{const p=new URLSearchParams();p.set('correlationId',c);p.set('take','250');const r=await fetch(api+'/flows?'+p,{cache:'no-store'});if(r.status===401){location.href='/auth/sso?returnUrl='+encodeURIComponent(location.pathname);return}if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json(),traces=x.traces||[];$('flowOverlayBody').innerHTML=traces.length?traces.map(t=>'<article class="trace"><div class="trace-head"><b class="'+esc(t.status)+'">'+esc(t.status)+'</b><div class="grow"><b>'+esc(t.flow)+'</b><div class="trace-meta">'+esc(t.applicationId)+' / '+esc(t.instanceId)+' · '+esc(t.correlationId)+'</div></div><div class="trace-meta">'+t.durationMs+' ms · '+t.eventCount+' events</div></div><div class="stages">'+(t.stages||[]).map(s=>'<div class="stage"><div class="lamp '+esc(s.outcome)+'"></div><b>'+esc(s.stage)+'</b><small>'+esc(s.outcome)+' · '+fmt(s.occurredAtUtc)+'</small></div>').join('')+'</div></article>').join(''):'<div class="overlay-empty">No correlated lifecycle flow has been observed for this event.</div>'}catch(err){$('flowOverlayBody').innerHTML='<div class="overlay-empty">Flow unavailable · '+esc(err.message)+'</div>'}}
function openAnalyzer(c,key){const match=eventsNow.find(e=>key?eventKey(e)===key:e.correlationId===c);if(!match)return;selectEvent(match);analyzerEvent={...match};overlayOpen=true;lastFocused=document.activeElement;$('flowOverlay').hidden=false;refreshOverlay()}
function closeAnalyzer(){overlayOpen=false;analyzerEvent=null;$('flowOverlay').hidden=true;if(lastFocused?.focus)lastFocused.focus({preventScroll:true})}
$('flowOverlayClose').onclick=closeAnalyzer;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlayOpen)closeAnalyzer()});
async function refresh(){if(paused)return;try{const endpoint=mode==='activity'?'/activity':'/logs',r=await fetch(api+endpoint+'?'+params(),{cache:'no-store'});if(r.status===401){location.href='/auth/sso?returnUrl='+encodeURIComponent(location.pathname+location.search+location.hash);return}if(!r.ok)throw new Error('HTTP '+r.status);const x=await r.json();let events=x.events||[];if(mode==='activity'){try{const sr=await fetch(api+'/status',{cache:'no-store'});if(sr.ok){const status=await sr.json(),healthEvents=(status.observations||[]).filter(o=>!['healthy','passed'].includes(String(o.health||o.state||o.status||'unknown').toLowerCase())).map(o=>({occurredAtUtc:o.observedAtUtc,applicationId:o.applicationId||o.name||'Application',instanceId:o.instanceId||'',flow:'Health',stage:'HealthObservation',outcome:['unhealthy','failed','critical','error'].includes(String(o.health||o.state||o.status||'').toLowerCase())?'Failed':'Warning',detail:(o.health||o.state||o.status||'Unknown')+(o.summary?' · '+o.summary:''),correlationId:o.correlationId||''}));events=[...events,...healthEvents].sort((a,b)=>new Date(a.occurredAtUtc||a.timestampUtc)-new Date(b.occurredAtUtc||b.timestampUtc))}}catch{}}if(hiddenBefore)events=events.filter(e=>new Date(e.occurredAtUtc||e.timestampUtc)>hiddenBefore);eventsNow=events;$('view').innerHTML=events.length?events.map(rowMarkup).join(''):emptyMarkup();bindRows();restoreSelection();$('state').textContent=events.length+' '+(mode==='logs'?'LOGS':'EVENTS')+' · '+recentStamp().split(' ').slice(3).join(' ');$('lastScan').textContent='Last Scan: '+recentStamp();updateSummary(events.length);liveLog.innerHTML=events.slice(-4).map(e=>'<div class="row"><span class="t">'+fmt(e.occurredAtUtc||e.timestampUtc)+'</span> <span class="inf">INF</span> <span class="src">['+esc(e.applicationId)+']</span> '+esc(e.detail||e.message||e.stage||'Event')+'</div>').join('')||'<div class="row"><span class="t">'+recentStamp()+'</span> <span class="inf">INF</span> <span class="src">[Logs]</span> No matching events</div>'}catch(e){$('state').textContent='LOGS UNAVAILABLE · '+e.message}}
function tabs(){$('activityTab').classList.toggle('active',mode==='activity');$('logsTab').classList.toggle('active',mode==='logs');$('level').disabled=mode==='activity';$('level').hidden=mode==='activity';$('flow').placeholder=mode==='activity'?'Flow':'Category';updateSummary(eventsNow.length)}
$('activityTab').onclick=()=>{mode='activity';selectedKey=null;selectedEvent=null;tabs();refresh()};$('logsTab').onclick=()=>{mode='logs';selectedKey=null;selectedEvent=null;tabs();refresh()};
$('apply').onclick=async()=>{await refresh();setFiltersOpen(false)};
function resetFilters(){for(const id of ['application','instance','flow','level','correlation','text'])$(id).value='';$('minutes').value='60';hiddenBefore=null;selectedKey=null;selectedEvent=null;setFiltersOpen(false);refresh()}window.resetFilters=resetFilters;$('reset').onclick=resetFilters;
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(!paused)refresh()};$('follow').onclick=()=>{followTail=!followTail;$('follow').textContent='Tail: '+(followTail?'On':'Off')};$('clear').onclick=()=>{hiddenBefore=new Date();eventsNow=[];selectedKey=null;selectedEvent=null;$('view').innerHTML='<div class="empty">View cleared. New events will appear here.</div>';updateSummary(0)};
tabs();refresh();setInterval(refresh,2000);
</script>
</body>
</html>
