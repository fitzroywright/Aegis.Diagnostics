<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Diagnostics Console</title><style>:root{--ink:#f7f4ee;--orange:#ff9900;--vio:#9999ff;--lav:#cc99cc;--blue:#99ccff;--green:#99cc99;--yellow:#ffcc66;--red:#cc6666}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#153f61 0,#061d30 27%,#00101c 60%,#00070d 100%);color:var(--ink);font-family:Arial,sans-serif;font-weight:700;letter-spacing:.035em}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:linear-gradient(115deg,rgba(255,255,255,.03),transparent 22%,transparent 72%,rgba(77,185,255,.025)),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}.frame{min-height:100vh;padding:10px;display:grid;grid-template-columns:190px 1fr;grid-template-rows:92px 1fr;gap:0 10px}.elbow,.title{background:linear-gradient(180deg,#d8caff,#a894ff 42%,#6652c3);box-shadow:inset 0 2px 2px rgba(255,255,255,.62),inset 0 -8px 15px rgba(32,19,91,.4),0 5px 18px rgba(0,0,0,.48)}.elbow{border-radius:50px 0 0 0;position:relative}.elbow:after{content:"";position:absolute;right:0;bottom:0;width:48px;height:46px;background:#00101c;border-radius:24px 0 0 0}.title{color:#07111b;border-radius:0 30px 30px 0;padding:32px 18px 8px;text-align:right;font-size:clamp(25px,4vw,45px);font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.5),0 2px 3px rgba(0,0,0,.3)}.levels{background:linear-gradient(180deg,#b9aaff 0 16%,#02070b 16% 18%,#8bd7ff 18% 34%,#02070b 34% 36%,#e3afe3 36% 52%,#02070b 52% 54%,#ffb329 54% 70%,#02070b 70% 72%,#ffae82 72%);border-radius:0 0 0 48px;padding-top:20px;box-shadow:inset 3px 0 2px rgba(255,255,255,.28),inset -10px 0 20px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.45)}.level{display:block;width:calc(100% - 20px);margin:9px 0 0 20px;border:1px solid rgba(255,255,255,.55);border-radius:24px 0 0 24px;padding:12px;text-align:left;font-weight:900;color:#07111b;box-shadow:inset 0 2px 1px rgba(255,255,255,.58),inset 0 -5px 9px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.4)}.l5{background:linear-gradient(#d4f2ff,#78caff,#3983bd)}.l4{background:linear-gradient(#d8caff,#9e8cff,#6250bf)}.l3{background:linear-gradient(#c6ffda,#63d99a,#28885a)}.l2{background:linear-gradient(#ffe8a5,#ffc94d,#b77a00)}.l1{background:linear-gradient(#ffc1c1,#e96f6f,#9d3232)}.level:hover{filter:brightness(1.16)}.main{padding:16px 4px;background:linear-gradient(145deg,rgba(5,32,51,.5),rgba(0,10,18,.72));border-radius:0 18px 18px 0}.bands{display:grid;grid-template-columns:1.5fr .5fr .3fr;gap:7px}.band{height:25px;border-radius:13px;background:linear-gradient(#e7c3e7,#c690c6,#825882);color:#07111b;padding:5px 12px;font-size:11px;box-shadow:inset 0 2px 1px rgba(255,255,255,.5),0 3px 7px rgba(0,0,0,.4)}.band:nth-child(2){background:linear-gradient(#ffd77d,#ff9f16,#b65c00)}.band:nth-child(3){background:linear-gradient(#d4f2ff,#78caff,#3983bd)}.nav{margin:12px 0}.nav a{color:#8fdcff;text-shadow:0 0 8px rgba(91,196,255,.35)}.auth{display:flex;gap:7px;margin:12px 0}.auth input,textarea{background:linear-gradient(180deg,#0b304c,#021522);color:white;border:1px solid #7f75e8;padding:10px;box-shadow:inset 0 2px 7px rgba(0,0,0,.5),0 2px 7px rgba(0,0,0,.35)}.auth input{flex:1}.auth button{border:1px solid #ffd36d;border-radius:17px;padding:10px 16px;background:linear-gradient(#ffd77d,#ff9f16,#b65c00);font-weight:900;box-shadow:inset 0 2px 1px rgba(255,255,255,.58),0 3px 8px rgba(0,0,0,.4)}textarea{width:100%;min-height:68px;margin:5px 0 18px}.run{display:grid;grid-template-columns:160px 1fr 140px;gap:10px;border-top:10px solid var(--blue);border-right:2px solid var(--blue);padding:12px;margin:10px 0;background:linear-gradient(145deg,rgba(11,53,81,.96),rgba(1,24,40,.98) 52%,rgba(0,11,20,.99));box-shadow:inset 0 1px 0 rgba(173,227,255,.25),inset 0 -12px 24px rgba(0,0,0,.25),0 6px 17px rgba(0,0,0,.46)}.check{padding:8px;margin:6px 0;background:linear-gradient(180deg,#0d344f,#031724);border-left:12px solid var(--vio);box-shadow:inset 0 1px 0 rgba(170,223,255,.16)}.status-Passed{color:#71efad;text-shadow:0 0 9px rgba(113,239,173,.4)}.status-Warning{color:#ffd96d}.status-Failed{color:#ff7d7d}.status-InterventionRequired{color:#ffad47}@media(max-width:720px){.frame{grid-template-columns:72px 1fr;grid-template-rows:74px 1fr}.title{font-size:22px;padding-top:25px}.level{font-size:0;height:42px;margin-left:10px;width:calc(100% - 10px)}.run{display:block}.auth{display:grid}.elbow:after{width:26px;height:32px}}</style></head><body><div class="frame"><div class="elbow"></div><header class="title">ENGINEERING DIAGNOSTICS</header><aside class="levels"><button class="level l5" data-level="5">LEVEL 5 — SCAN</button><button class="level l4" data-level="4">LEVEL 4 — ANALYSIS</button><button class="level l3" data-level="3">LEVEL 3 — VERIFICATION</button><button class="level l2" data-level="2">LEVEL 2 — REPAIR</button><button class="level l1" data-level="1">LEVEL 1 — CRITICAL</button></aside><main class="main"><div class="bands"><div class="band">ENGINEERING CONTROL MATRIX</div><div class="band">LEVELS 5 → 1</div><div class="band">READY</div></div><div class="nav"><a href="/">← HEALTH OVERVIEW</a></div><div class="auth"><input id="key" type="password" placeholder="DIAGNOSTICS AUTHORIZATION KEY"><button id="unlock">AUTHORIZE</button><button id="lock">LOCK</button></div><textarea id="reason" placeholder="ENGINEERING REASON / INCIDENT CONTEXT — REQUIRED FOR LEVELS 2 AND 1"></textarea><div id="runs">CONSOLE LOCKED.</div></main></div><script>const api='/api/engineering/diagnostics',header='X-Aegis-Diagnostics-Key',runs=document.getElementById('runs'),reason=document.getElementById('reason'),key=document.getElementById('key');let k=sessionStorage.getItem('systemDiagnosticsKey')||'';key.value=k;const sn=v=>typeof v==='number'?({1:'Passed',2:'Warning',3:'Failed',4:'InterventionRequired'}[v]||v):v;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!k){runs.textContent='CONSOLE LOCKED.';return}const r=await fetch(api+'/runs?take=25',{headers:{[header]:k}});if(!r.ok){runs.textContent='AUTHORIZATION FAILED.';return}const d=await r.json();runs.innerHTML=d.length?d.map(x=>`<section class="run"><div>LEVEL ${esc(x.level)}<br><small>${new Date(x.startedAt).toLocaleString()}</small></div><div><b>${esc(x.application)}</b>${(x.checks||[]).map(c=>`<div class="check"><b>${esc(c.name)}</b><div>${esc(c.summary)}</div></div>`).join('')}</div><div class="status-${esc(sn(x.status))}"><b>${esc(sn(x.status))}</b></div></section>`).join(''):'NO DIAGNOSTIC RUNS RECORDED.'}async function run(level){if(!k)return alert('AUTHORIZE FIRST.');if(level<=2&&!reason.value.trim())return alert('LEVELS 2 AND 1 REQUIRE AN ENGINEERING REASON.');const r=await fetch(api+'/run',{method:'POST',headers:{[header]:k,'Content-Type':'application/json'},body:JSON.stringify({level,reason:reason.value.trim()||null})});if(!r.ok)alert(await r.text());else load()}unlock.onclick=()=>{k=key.value.trim();sessionStorage.setItem('systemDiagnosticsKey',k);load()};lock.onclick=()=>{k='';key.value='';sessionStorage.removeItem('systemDiagnosticsKey');load()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>run(Number(b.dataset.level)));load()</script></body></html>
