<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Diagnostics Console</title><style>:root{--bg:#05070d;--panel:#101521;--line:#29344b;--text:#f4f7ff;--muted:#aeb8ca;--orange:#f4a261;--blue:#64b5f6;--green:#78e08f;--yellow:#ffd166;--red:#ff5d73;--violet:#9d8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.shell{max-width:1450px;margin:auto;padding:14px}.top{display:flex;gap:12px;align-items:center;border-bottom:7px solid var(--violet);padding:8px}.logo{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:inset 0 0 0 10px #111827}.top h1{margin:0}.top p{margin:4px 0;color:var(--muted)}.layout{display:grid;grid-template-columns:260px 1fr;gap:12px;margin-top:12px}.levels{display:grid;gap:7px}.level{border:0;border-radius:22px 5px 5px 22px;padding:14px;text-align:left;font-weight:900}.l5{background:var(--blue)}.l4{background:var(--violet)}.l3{background:var(--green)}.l2{background:var(--yellow)}.l1{background:var(--red)}.main{background:var(--panel);border:1px solid var(--line);padding:15px}.auth{display:flex;gap:7px}.auth input,textarea{background:#090d15;color:var(--text);border:1px solid #46536c;padding:10px}.auth input{flex:1}.auth button{border:0;border-radius:16px;padding:10px 16px;background:var(--orange);font-weight:800}textarea{width:100%;min-height:64px;margin-top:10px}.run{display:grid;grid-template-columns:170px 1fr 140px;gap:10px;border-top:1px solid var(--line);padding:12px 0}.check{padding:8px;margin:6px 0;background:#171d2a;border-left:6px solid var(--blue)}.status-Passed{color:var(--green)}.status-Warning{color:var(--yellow)}.status-Failed{color:var(--red)}.status-InterventionRequired{color:var(--orange)}a{color:var(--blue)}@media(max-width:700px){.layout{display:block}.levels{margin:10px 0}.run{display:block}.auth{display:grid}.auth input{width:100%}}</style></head><body><main class="shell"><header class="top"><div class="logo"></div><div><h1>SYSTEM DIAGNOSTICS</h1><p>Engineering Console • <a href="/">Back to Health Overview</a></p></div></header><div class="layout"><aside class="levels"><button class="level l5" data-level="5">LEVEL 5 — SCAN</button><button class="level l4" data-level="4">LEVEL 4 — ANALYSIS</button><button class="level l3" data-level="3">LEVEL 3 — VERIFICATION</button><button class="level l2" data-level="2">LEVEL 2 — REPAIR</button><button class="level l1" data-level="1">LEVEL 1 — CRITICAL</button></aside><section class="main"><div class="auth"><input id="key" type="password" placeholder="Diagnostics console key"><button id="unlock">UNLOCK</button><button id="lock">LOCK</button></div><textarea id="reason" placeholder="Engineering reason / incident context (required for Levels 2 and 1)"></textarea><div id="runs">Console locked.</div></section></div></main><script>const api='/api/engineering/diagnostics',header='X-Aegis-Diagnostics-Key',runs=document.getElementById('runs'),reason=document.getElementById('reason'),key=document.getElementById('key');let k=sessionStorage.getItem('systemDiagnosticsKey')||'';key.value=k;const sn=v=>typeof v==='number'?({1:'Passed',2:'Warning',3:'Failed',4:'InterventionRequired'}[v]||v):v;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!k){runs.textContent='Console locked.';return}const r=await fetch(api+'/runs?take=25',{headers:{[header]:k}});if(!r.ok){runs.textContent='Authentication failed.';return}const d=await r.json();runs.innerHTML=d.length?d.map(x=>`<section class="run"><div>Level ${esc(x.level)}<br><small>${new Date(x.startedAt).toLocaleString()}</small></div><div><b>${esc(x.application)}</b>${(x.checks||[]).map(c=>`<div class="check"><b>${esc(c.name)}</b><div>${esc(c.summary)}</div></div>`).join('')}</div><div class="status-${esc(sn(x.status))}"><b>${esc(sn(x.status))}</b></div></section>`).join(''):'No diagnostic runs yet.'}async function run(level){if(!k)return alert('Unlock first.');if(level<=2&&!reason.value.trim())return alert('Levels 2 and 1 require a reason.');const r=await fetch(api+'/run',{method:'POST',headers:{[header]:k,'Content-Type':'application/json'},body:JSON.stringify({level,reason:reason.value.trim()||null})});if(!r.ok)alert(await r.text());else load()}unlock.onclick=()=>{k=key.value.trim();sessionStorage.setItem('systemDiagnosticsKey',k);load()};lock.onclick=()=>{k='';key.value='';sessionStorage.removeItem('systemDiagnosticsKey');load()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>run(Number(b.dataset.level)));load()</script></body></html>
