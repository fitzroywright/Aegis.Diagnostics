<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Diagnostics Console</title><style>:root{--bg:#000;--ink:#f7f4ee;--peach:#ff9966;--orange:#ff9900;--vio:#9999ff;--lav:#cc99cc;--blue:#99ccff;--sand:#ffcc99;--green:#99cc99;--yellow:#ffcc66;--red:#cc6666}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--ink);font-family:Arial,sans-serif;font-weight:700;letter-spacing:.035em}.frame{min-height:100vh;padding:10px;display:grid;grid-template-columns:190px 1fr;grid-template-rows:92px 1fr;gap:0 10px}.elbow{background:var(--vio);border-radius:50px 0 0 0;position:relative}.elbow:after{content:"";position:absolute;right:0;bottom:0;width:48px;height:46px;background:#000;border-radius:24px 0 0 0}.title{background:var(--vio);color:#000;border-radius:0 30px 30px 0;padding:32px 18px 8px;text-align:right;font-size:clamp(25px,4vw,45px);font-weight:900}.levels{background:linear-gradient(var(--vio) 0 16%,#000 16% 18%,var(--blue) 18% 34%,#000 34% 36%,var(--lav) 36% 52%,#000 52% 54%,var(--orange) 54% 70%,#000 70% 72%,var(--peach) 72%);border-radius:0 0 0 48px;padding-top:20px}.level{display:block;width:calc(100% - 20px);margin:9px 0 0 20px;border:0;border-radius:24px 0 0 24px;padding:12px;text-align:left;font-weight:900;color:#000}.l5{background:var(--blue)}.l4{background:var(--vio)}.l3{background:var(--green)}.l2{background:var(--yellow)}.l1{background:var(--red)}.main{padding:16px 4px}.bands{display:grid;grid-template-columns:1.5fr .5fr .3fr;gap:7px}.band{height:25px;border-radius:13px;background:var(--lav);color:#000;padding:5px 12px;font-size:11px}.band:nth-child(2){background:var(--orange)}.band:nth-child(3){background:var(--blue)}.nav{margin:12px 0}.nav a{color:var(--blue)}.auth{display:flex;gap:7px;margin:12px 0}.auth input,textarea{background:#080808;color:white;border:2px solid var(--vio);padding:10px}.auth input{flex:1}.auth button{border:0;border-radius:17px;padding:10px 16px;background:var(--orange);font-weight:900}textarea{width:100%;min-height:68px;margin:5px 0 18px}.run{display:grid;grid-template-columns:160px 1fr 140px;gap:10px;border-top:10px solid var(--blue);border-right:2px solid var(--blue);padding:12px;margin:10px 0}.check{padding:8px;margin:6px 0;background:#090909;border-left:12px solid var(--vio)}.status-Passed{color:var(--green)}.status-Warning{color:var(--yellow)}.status-Failed{color:var(--red)}.status-InterventionRequired{color:var(--orange)}@media(max-width:720px){.frame{grid-template-columns:72px 1fr;grid-template-rows:74px 1fr}.title{font-size:22px;padding-top:25px}.level{font-size:0;height:42px;margin-left:10px;width:calc(100% - 10px)}.run{display:block}.auth{display:grid}.elbow:after{width:26px;height:32px}}</style></head><body><div class="frame"><div class="elbow"></div><header class="title">ENGINEERING DIAGNOSTICS</header><aside class="levels"><button class="level l5" data-level="5">LEVEL 5 — SCAN</button><button class="level l4" data-level="4">LEVEL 4 — ANALYSIS</button><button class="level l3" data-level="3">LEVEL 3 — VERIFICATION</button><button class="level l2" data-level="2">LEVEL 2 — REPAIR</button><button class="level l1" data-level="1">LEVEL 1 — CRITICAL</button></aside><main class="main"><div class="bands"><div class="band">ENGINEERING CONTROL MATRIX</div><div class="band">LEVELS 5 → 1</div><div class="band">READY</div></div><div class="nav"><a href="/">← HEALTH OVERVIEW</a></div><div class="auth"><input id="key" type="password" placeholder="DIAGNOSTICS AUTHORIZATION KEY"><button id="unlock">AUTHORIZE</button><button id="lock">LOCK</button></div><textarea id="reason" placeholder="ENGINEERING REASON / INCIDENT CONTEXT — REQUIRED FOR LEVELS 2 AND 1"></textarea><div id="runs">CONSOLE LOCKED.</div></main></div><script>const api='/api/engineering/diagnostics',header='X-Aegis-Diagnostics-Key',runs=document.getElementById('runs'),reason=document.getElementById('reason'),key=document.getElementById('key');let k=sessionStorage.getItem('systemDiagnosticsKey')||'';key.value=k;const sn=v=>typeof v==='number'?({1:'Passed',2:'Warning',3:'Failed',4:'InterventionRequired'}[v]||v):v;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){if(!k){runs.textContent='CONSOLE LOCKED.';return}const r=await fetch(api+'/runs?take=25',{headers:{[header]:k}});if(!r.ok){runs.textContent='AUTHORIZATION FAILED.';return}const d=await r.json();runs.innerHTML=d.length?d.map(x=>`<section class="run"><div>LEVEL ${esc(x.level)}<br><small>${new Date(x.startedAt).toLocaleString()}</small></div><div><b>${esc(x.application)}</b>${(x.checks||[]).map(c=>`<div class="check"><b>${esc(c.name)}</b><div>${esc(c.summary)}</div></div>`).join('')}</div><div class="status-${esc(sn(x.status))}"><b>${esc(sn(x.status))}</b></div></section>`).join(''):'NO DIAGNOSTIC RUNS RECORDED.'}async function run(level){if(!k)return alert('AUTHORIZE FIRST.');if(level<=2&&!reason.value.trim())return alert('LEVELS 2 AND 1 REQUIRE AN ENGINEERING REASON.');const r=await fetch(api+'/run',{method:'POST',headers:{[header]:k,'Content-Type':'application/json'},body:JSON.stringify({level,reason:reason.value.trim()||null})});if(!r.ok)alert(await r.text());else load()}unlock.onclick=()=>{k=key.value.trim();sessionStorage.setItem('systemDiagnosticsKey',k);load()};lock.onclick=()=>{k='';key.value='';sessionStorage.removeItem('systemDiagnosticsKey');load()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>run(Number(b.dataset.level)));load()</script></body></html>
