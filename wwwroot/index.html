<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aegis.Diagnostics</title><style>
:root{--bg:#05070d;--panel:#101521;--line:#29344b;--text:#f4f7ff;--muted:#aeb8ca;--orange:#f4a261;--blue:#64b5f6;--green:#78e08f;--yellow:#ffd166;--red:#ff5d73;--violet:#9d8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1500px;margin:auto;padding:14px}.top{display:grid;grid-template-columns:180px 1fr 120px;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}.curve{background:var(--orange);border-radius:34px 0 0 34px}.title{background:var(--panel);border-bottom:8px solid var(--violet);padding:10px 18px}.title h1{margin:0;font-size:22px}.title p{margin:4px 0 0;color:var(--muted);font-size:12px}.cap{background:var(--blue);border-radius:0 34px 34px 0}.layout{display:grid;grid-template-columns:270px 1fr;gap:12px;margin-top:12px}.levels{display:flex;flex-direction:column;gap:7px}.level{border:0;border-radius:24px 5px 5px 24px;padding:13px;text-align:left;font-weight:800;cursor:pointer;color:#10131b}.level small{display:block;margin-top:3px;font-weight:500}.l5{background:var(--blue)}.l4{background:var(--violet)}.l3{background:var(--green)}.l2{background:var(--yellow)}.l1{background:var(--red)}.main{background:var(--panel);border:1px solid var(--line);padding:15px;min-height:570px}.bar{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#252d3f;padding:6px 11px;border-radius:16px;font-size:12px}.auth{display:flex;gap:7px;margin:12px 0}.auth input,textarea{background:#090d15;color:var(--text);border:1px solid #46536c;padding:10px}.auth input{flex:1}.auth button{border:0;border-radius:16px;padding:10px 16px;background:var(--orange);font-weight:800}textarea{width:100%;min-height:64px}.run{display:grid;grid-template-columns:175px 1fr 145px;gap:10px;border-top:1px solid var(--line);padding:12px 0}.check{padding:8px 10px;margin:6px 0;background:#171d2a;border-left:7px solid var(--blue);overflow-wrap:anywhere}.Passed{border-color:var(--green)}.Warning{border-color:var(--yellow)}.Failed{border-color:var(--red)}.InterventionRequired{border-color:var(--orange)}.status-Passed{color:var(--green)}.status-Warning{color:var(--yellow)}.status-Failed{color:var(--red)}.status-InterventionRequired{color:var(--orange)}.footer{margin-top:12px;border-top:8px solid var(--orange);padding:9px 0 calc(9px + env(safe-area-inset-bottom));color:var(--muted);font-size:11px}.busy{opacity:.55;pointer-events:none}.mobile-nav{display:none}
@media(max-width:900px){.top{grid-template-columns:60px 1fr 60px}.layout{grid-template-columns:210px 1fr}.run{grid-template-columns:1fr}.levels .level{padding:12px}.title p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:640px){body{padding-bottom:70px}.shell{padding:8px}.top{grid-template-columns:38px 1fr 38px}.title{padding:8px 10px;border-bottom-width:6px}.title h1{font-size:18px}.layout{display:block}.levels{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}.level{border-radius:18px;padding:11px 13px}.main{padding:11px;min-height:0}.auth{display:grid;grid-template-columns:1fr 1fr}.auth input{grid-column:1/-1;width:100%}.run{display:block;padding:12px 0}.run>div{margin-bottom:7px}.check{border-left-width:6px}.mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;background:#0b101a;border-top:5px solid var(--blue);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));justify-content:space-around}.mobile-nav a{color:var(--text);text-decoration:none;font-size:12px;font-weight:800;padding:8px}.footer{margin-bottom:8px}}
:focus-visible{outline:3px solid white;outline-offset:2px}@media print{.levels,.auth,textarea,.mobile-nav,.curve,.cap{display:none}.layout{display:block}.main{border:0}.top{position:static;grid-template-columns:1fr}.title{border:0}.run{break-inside:avoid}}
</style></head><body><div class="shell"><header class="top"><div class="curve"></div><div class="title"><h1>AEGIS.DIAGNOSTICS</h1><p>KNOW WHAT IS WORKING. KNOW WHAT NEEDS ATTENTION.</p></div><div class="cap"></div></header><div class="layout"><aside class="levels"><button class="level l5" data-level="5">LEVEL 5 — SCAN<small>Fast baseline health and heartbeat</small></button><button class="level l4" data-level="4">LEVEL 4 — ANALYSIS<small>Dependencies, data flow and error evidence</small></button><button class="level l3" data-level="3">LEVEL 3 — VERIFICATION<small>Verify fault or recovery</small></button><button class="level l2" data-level="2">LEVEL 2 — REPAIR<small>Authorized controlled repair stage</small></button><button class="level l1" data-level="1">LEVEL 1 — CRITICAL<small>High-trust emergency intervention</small></button></aside><main class="main"><div class="bar"><span class="chip">SYSTEM: AEGIS OPERATIONS</span><span class="chip" id="status">CONSOLE LOCKED</span><span class="chip" id="clock"></span></div><div class="auth"><input id="consoleKey" type="password" autocomplete="off" placeholder="Engineering Diagnostics console key"><button id="unlock">UNLOCK</button><button id="lock">LOCK</button></div><textarea id="reason" placeholder="Engineering reason / incident context (required for Level 2 and Level 1)"></textarea><div id="runs">Enter the Engineering Diagnostics console key.</div></main></div><div class="footer">ENGINEERING DIAGNOSTICS • APPLICATION-AUTHORITATIVE HEALTH • HISTORY PRESERVED • SECRETS NEVER DISPLAYED</div></div><nav class="mobile-nav"><a href="#">STATUS</a><a href="#runs">RUNS</a><a href="#reason">RUN</a></nav><script>
const api='/api/engineering/diagnostics',header='X-Aegis-Diagnostics-Key',runs=document.getElementById('runs'),statusEl=document.getElementById('status'),reason=document.getElementById('reason'),keyInput=document.getElementById('consoleKey');let consoleKey=sessionStorage.getItem('aegisDiagnosticsKey')||'';keyInput.value=consoleKey;setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString(),1000);const levelNames={5:'Level 5 — Scan',4:'Level 4 — Analysis',3:'Level 3 — Verification',2:'Level 2 — Repair',1:'Level 1 — Critical Intervention'},statusNames={1:'Passed',2:'Warning',3:'Failed',4:'InterventionRequired'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sn(v){return typeof v==='number'?(statusNames[v]||v):v}function ln(v){return typeof v==='number'?(levelNames[v]||v):v}function render(run){const checks=(run.checks||[]).map(c=>`<div class="check ${esc(sn(c.status))}"><strong>${esc(c.name)}</strong> — <span class="status-${esc(sn(c.status))}">${esc(sn(c.status))}</span><div>${esc(c.summary)}</div>${c.evidence?`<small>${esc(c.evidence)}</small>`:''}</div>`).join('');return `<section class="run"><div><strong>${esc(ln(run.level))}</strong><br><small>${new Date(run.startedAt).toLocaleString()}</small></div><div><strong>${esc(run.application||'Application')}</strong>${run.reason?`<div>${esc(run.reason)}</div>`:''}${checks}</div><div class="status-${esc(sn(run.status))}"><strong>${esc(sn(run.status))}</strong></div></section>`}function headers(json=false){const h={[header]:consoleKey};if(json)h['Content-Type']='application/json';return h}async function apiFetch(url,options={}){options.headers={...(options.headers||{}),...headers(false)};const r=await fetch(url,options);if(r.status===401){statusEl.textContent='CONSOLE LOCKED';throw new Error('Unauthorized')}return r}async function load(){if(!consoleKey){runs.textContent='Enter the Engineering Diagnostics console key.';statusEl.textContent='CONSOLE LOCKED';return}try{const r=await apiFetch(`${api}/runs?take=25`);if(!r.ok){runs.textContent=`Unable to load runs (${r.status}).`;return}const data=await r.json();statusEl.textContent='CONSOLE READY';runs.innerHTML=data.length?data.map(render).join(''):'No diagnostic runs yet.'}catch{runs.textContent='Console authentication failed.'}}async function run(level){if(!consoleKey){alert('Unlock the console first.');return}if((level===1||level===2)&&!reason.value.trim()){alert('Level 2 and Level 1 require an engineering reason.');return}document.body.classList.add('busy');statusEl.textContent=`RUNNING LEVEL ${level}`;try{const r=await apiFetch(`${api}/run`,{method:'POST',headers:headers(true),body:JSON.stringify({level,reason:reason.value.trim()||null})});if(!r.ok)alert(await r.text());else{reason.value='';await load()}}catch(e){alert(e.message)}finally{document.body.classList.remove('busy')}}document.getElementById('unlock').addEventListener('click',()=>{consoleKey=keyInput.value.trim();if(consoleKey)sessionStorage.setItem('aegisDiagnosticsKey',consoleKey);load()});document.getElementById('lock').addEventListener('click',()=>{consoleKey='';keyInput.value='';sessionStorage.removeItem('aegisDiagnosticsKey');statusEl.textContent='CONSOLE LOCKED';runs.textContent='Console locked.'});document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>run(Number(b.dataset.level))));load();
</script></body></html>
