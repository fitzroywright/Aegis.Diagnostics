<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Diagnostics</title><style>:root{--bg:#05070d;--panel:#101521;--line:#29344b;--text:#f4f7ff;--muted:#aeb8ca;--orange:#f4a261;--blue:#64b5f6;--green:#78e08f;--yellow:#ffd166;--red:#ff5d73;--violet:#9d8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.shell{max-width:1400px;margin:auto;padding:16px}.top{display:flex;gap:14px;align-items:center;border-bottom:7px solid var(--violet);padding:8px}.logo{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:inset 0 0 0 11px #111827}.top h1{margin:0;font-size:clamp(24px,4vw,40px)}.top p,.muted{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.metric,.card,.incident{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.metric b{font-size:25px;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card h2{margin:0 0 6px}.Healthy,.Passed{color:var(--green)}.Degraded,.Warning{color:var(--yellow)}.Unhealthy,.Failed,.InterventionRequired{color:var(--red)}.Unknown{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}a,button{border:1px solid var(--blue);border-radius:18px;padding:9px 13px;background:transparent;color:var(--text);text-decoration:none;font-weight:800}.primary{background:var(--blue);color:#07101a}.auth{display:flex;gap:7px;margin:12px 0}.auth input{flex:1;background:#090d15;color:var(--text);border:1px solid #46536c;padding:10px}.incidents{display:grid;gap:7px}.stale{color:var(--yellow)}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:8px}.summary{grid-template-columns:1fr 1fr}.auth{display:grid}.auth input{width:100%}}</style></head><body><main class="shell"><header class="top"><div class="logo"></div><div><h1>SYSTEM DIAGNOSTICS</h1><p>IS THIS ENVIRONMENT HEALTHY?</p></div></header><div class="actions"><a class="primary" href="/console.html">OPEN ENGINEERING CONSOLE</a><a id="operations" href="#">SYSTEM OPERATIONS</a><a id="configuration" href="#">SYSTEM CONFIGURATION</a></div><div class="auth"><input id="key" type="password" placeholder="Operator key to load protected health details"><button id="unlock">LOAD HEALTH</button></div><section class="summary"><div class="metric"><b id="overall">UNKNOWN</b>Overall</div><div class="metric"><b id="healthy">0</b>Healthy</div><div class="metric"><b id="degraded">0</b>Degraded</div><div class="metric"><b id="unhealthy">0</b>Unhealthy</div><div class="metric"><b id="total">0</b>Total Targets</div></section><div id="updated" class="muted">Loading target registry…</div><h2>APPLICATION HEALTH</h2><section id="targets" class="grid"><div class="card">Loading…</div></section><h2>ACTIVE INCIDENTS</h2><section id="incidents" class="incidents"><div class="incident muted">Unlock health details to load incidents.</div></section></main><script>const api='/api/engineering/diagnostics',header='X-Aegis-Diagnostics-Key',key=document.getElementById('key');let k=sessionStorage.getItem('systemDiagnosticsKey')||'';key.value=k;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function get(path){return fetch(path,{headers:k?{[header]:k}:{}})}async function load(){try{const h=await fetch('/health').then(r=>r.json());document.getElementById('updated').textContent=`Site ${h.siteId||'—'} • Instance ${h.instanceId||'—'} • Updated ${new Date(h.utc).toLocaleString()}`;const r=await get(api+'/targets');if(r.status===401){document.getElementById('targets').innerHTML='<div class="card">Enter operator key to load application health.</div>';return}const targets=await r.json();let runs=[];const rr=await get(api+'/runs?take=100');if(rr.ok)runs=await rr.json();const latest={};for(const run of runs){const app=run.application||'';if(!latest[app]||new Date(run.completedAt)>new Date(latest[app].completedAt))latest[app]=run}let counts={Healthy:0,Degraded:0,Unhealthy:0,Unknown:0};document.getElementById('targets').innerHTML=targets.map(t=>{const run=latest[t.applicationId]||latest[t.name];let state='Unknown';if(run){const s=typeof run.status==='number'?run.status:String(run.status);state=(s===1||s==='Passed')?'Healthy':(s===2||s==='Warning')?'Degraded':'Unhealthy'}counts[state]++;return `<article class="card"><h2>${esc(t.name)}</h2><b class="${state}">${state.toUpperCase()}</b><p class="muted">${esc(t.applicationId||'')} • ${esc(t.siteId||'—')} • ${esc(t.instanceId||'—')}</p><p>${run?'Last diagnostic '+new Date(run.completedAt).toLocaleString():'No diagnostic run recorded.'}</p><a href="/console.html">VIEW DIAGNOSTICS</a></article>`}).join('')||'<div class="card">NO TARGETS REGISTERED</div>';document.getElementById('healthy').textContent=counts.Healthy;document.getElementById('degraded').textContent=counts.Degraded;document.getElementById('unhealthy').textContent=counts.Unhealthy;document.getElementById('total').textContent=targets.length;const overall=counts.Unhealthy?'Unhealthy':counts.Degraded?'Degraded':counts.Unknown?'Unknown':'Healthy';const oe=document.getElementById('overall');oe.textContent=overall.toUpperCase();oe.className=overall;const ir=await get(api+'/incidents?minutes=60');if(ir.ok){const inc=await ir.json();document.getElementById('incidents').innerHTML=inc.length?inc.map(i=>`<div class="incident"><b>${esc(i.summary)}</b><div class="muted">${esc((i.applications||[]).join(', '))}</div></div>`).join(''):'<div class="incident Healthy">NO ACTIVE CORRELATED INCIDENTS</div>'}}catch{document.getElementById('targets').innerHTML='<div class="card Unhealthy">DIAGNOSTICS DATA UNAVAILABLE</div>'}}document.getElementById('unlock').onclick=()=>{k=key.value.trim();if(k)sessionStorage.setItem('systemDiagnosticsKey',k);load()};load();</script></body></html>
